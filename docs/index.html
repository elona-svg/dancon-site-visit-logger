<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Site Visit">
  <meta name="application-name" content="Site Visit">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <title>Dancon Site Visit Logger</title>
  <link rel="stylesheet" href="css/style.css">
  <script async defer src="https://accounts.google.com/gsi/client"></script>
</head>
<body>
  <div id="app">
    <div class="boot">Loading…</div>
  </div>

  <div id="overlay-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script>
    (async function() {
      try {
        const res = await fetch('version.json', { cache: 'no-cache' });
        if (!res.ok) return;
        const data = await res.json();
        if (data.version && data.version !== window.CONFIG?.APP_VERSION) {
          console.log('[version] new app version available:', data.version);
          if ('serviceWorker' in navigator) {
            const reg = await navigator.serviceWorker.getRegistration();
            if (reg?.waiting) reg.waiting.postMessage('skip-waiting');
          }
          window.location.reload();
        }
      } catch (err) {
        console.warn('[version] check failed', err && err.message);
      }
    })();
  </script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/drive.js"></script>
  <script src="js/capture.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/annotate.js"></script>
  <script src="js/viewer.js"></script>
  <script src="js/video-player.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // Cache-bust the SW registration URL with the live APP_VERSION
        // so every release auto-busts the browser's SW cache and the
        // updatefound path actually fires. Previously this was hardcoded
        // to v49 and never changed — meaning iOS users kept the v49 SW
        // forever and had to reinstall the app to get any update.
        const ver = (window.CONFIG && window.CONFIG.APP_VERSION) || 'unknown';
        const swUrl = 'service-worker.js?v=' + encodeURIComponent(ver);
        navigator.serviceWorker.register(swUrl).then((reg) => {
          const notifyUpdate = () => {
            if (window.UI && typeof window.UI.showUpdateBanner === 'function') {
              window.UI.showUpdateBanner('App updated — tap to refresh');
            }
          };
          const watch = (worker) => {
            if (!worker) return;
            if (worker.state === 'activated' && navigator.serviceWorker.controller) notifyUpdate();
            worker.addEventListener('statechange', () => {
              console.log('[sw] new worker state →', worker.state);
              if (worker.state === 'activated' && navigator.serviceWorker.controller) notifyUpdate();
            });
          };
          if (reg.waiting) watch(reg.waiting);
          reg.addEventListener('updatefound', () => watch(reg.installing));
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            notifyUpdate();
          });
          // Actively check for a new SW on every launch so CACHE_VERSION bumps
          // are discovered immediately instead of waiting passively.
          reg.update().catch(() => {});
          // Poll every 30 min while the app stays open — covers techs
          // who keep the PWA running all day.
          setInterval(() => { reg.update().catch(() => {}); }, 30 * 60 * 1000);
        }).catch((err) => {
          console.warn('SW register failed', err);
        });
      });
    }
  </script>
</body>
</html>
